{% extends "base.html" %}{% block content %}
<section class="card mx-auto p-4 auth-card"><h1 class="h3">{{ title }}</h1>
<form id="auth-form"><label class="form-label">Email<input name="email" type="email" required class="form-control"></label>
{% if page == 'register' %}<label class="form-label">Full name<input name="full_name" required class="form-control"></label>{% endif %}
<label class="form-label">Password<input name="password" type="password" required minlength="{% if page == 'register' %}12{% else %}1{% endif %}" class="form-control"></label>
<button class="btn btn-primary">{{ title }}</button></form>
<p class="mt-3">{% if page == 'login' %}<a href="/register">Create account</a>{% else %}<a href="/login">Sign in</a>{% endif %}</p></section>
{% endblock %}
