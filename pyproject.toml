[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv-*", ".tools", ".python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app.main", "app.config", "app.database", "app.models", "app.routers.health", "app.services.redactor", "app.services.log_parser"]

[tool.coverage.report]
show_missing = true
